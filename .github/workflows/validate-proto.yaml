# Prototype only, not part of any upstream PR: builds the binary and tries it on sample configs.
name: validate prototype
on:
  push:
    branches: [validate-command, validate-v0.33.6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make get-envoy
      - run: CGO_ENABLED=0 go build -o bin/pomerium ./cmd/pomerium
      - run: bin/pomerium --version
      - run: go test ./cmd/pomerium/ -run TestValidateCommand -v -count=1 2>&1 | grep -vE '"level":"(info|error)"'
      - uses: actions/upload-artifact@v4
        with:
          name: pomerium-validate-linux-amd64
          path: bin/pomerium
          retention-days: 7
